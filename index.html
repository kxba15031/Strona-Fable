<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16a34a">
  <meta name="description" content="Grosik – menedżer finansów: budżet z agentem, wydatki, cele oszczędnościowe, lista zakupów i przepisy.">
  <title>Grosik</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%2316a34a'/%3E%3Ccircle cx='32' cy='32' r='20' fill='%23facc15'/%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Grosik">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/pages.css">
</head>
<body>
  <div class="bg" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>

  <!-- Ekran logowania do wspólnych danych (src/features/sync) -->
  <div class="login" id="login" hidden></div>

  <header class="topbar">
    <a class="brand" href="#top">
      <span class="brand-mark" aria-hidden="true"><span></span></span>
      <span class="brand-name">Grosik</span>
    </a>
    <span class="month" id="monthLabel"></span>
    <button type="button" class="theme-toggle" id="themeToggle" aria-label="Przełącz tryb ciemny" aria-pressed="false">
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M12 2v2 M12 20v2 M4 12H2 M22 12h-2 M5 5l1.5 1.5 M17.5 17.5L19 19 M19 5l-1.5 1.5 M6.5 17.5L5 19"/></svg>
    </button>
    <nav class="tabs" role="tablist" aria-label="Sekcje">
      <button type="button" class="tab" role="tab" id="tab-budget" data-view="budget" aria-controls="view-budget">Budżet</button>
      <button type="button" class="tab" role="tab" id="tab-spend" data-view="spend" aria-controls="view-spend">Wydatki</button>
      <button type="button" class="tab" role="tab" id="tab-goals" data-view="goals" aria-controls="view-goals">Cele</button>
      <button type="button" class="tab" role="tab" id="tab-shop" data-view="shop" aria-controls="view-shop">Zakupy</button>
      <button type="button" class="tab" role="tab" id="tab-recipes" data-view="recipes" aria-controls="view-recipes">Przepisy</button>
    </nav>
  </header>

  <!-- Treść zakładek wstawiają moduły z src/pages -->
  <main id="top">
    <div class="layout" id="view-budget" role="tabpanel" aria-labelledby="tab-budget"></div>
    <div class="layout" id="view-spend" role="tabpanel" aria-labelledby="tab-spend" hidden></div>
    <div class="layout" id="view-goals" role="tabpanel" aria-labelledby="tab-goals" hidden></div>
    <div class="layout" id="view-shop" role="tabpanel" aria-labelledby="tab-shop" hidden></div>
    <div class="layout" id="view-recipes" role="tabpanel" aria-labelledby="tab-recipes" hidden></div>
  </main>

  <footer class="footer">
    <p id="footerNote">Dane zapisują się wyłącznie w Twojej przeglądarce. Zrób kopię, żeby ich nie stracić.</p>
    <div class="sync-box" id="syncBox" hidden>
      <p id="syncNote" aria-live="polite"></p>
      <p id="accountBox" hidden>Zalogowano: <strong id="accountEmail"></strong> · <button type="button" class="link" id="signOutBtn">Wyloguj</button></p>
    </div>
    <p class="footer-actions">
      <button type="button" class="link" id="exportBtn">Pobierz kopię</button>
      <label class="link" for="importFile">Wczytaj kopię</label>
      <input type="file" id="importFile" accept=".json,application/json" class="visually-hidden">
      <button type="button" class="link" id="resetBtn">Wyczyść dane</button>
    </p>
    <p id="backupNote" aria-live="polite"></p>
  </footer>

  <script type="module" src="src/main.js"></script>
</body>
</html>
